<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 540' width='880' height='540' font-family='IBM Plex Sans, Segoe UI, Arial, sans-serif'><title>Reconstructed identity graph</title><rect width='880' height='540' fill='#FFFFFF'/><text x='24' y='22' font-size='1' fill='#16201C' text-anchor='start' font-weight='400'></text><line x1='130' y1='120' x2='330' y2='120' stroke='#5B6862' stroke-width='2'/><line x1='330' y1='120' x2='540' y2='120' stroke='#5B6862' stroke-width='2'/><line x1='740' y1='120' x2='540' y2='120' stroke='#5B6862' stroke-width='2'/><line x1='740' y1='300' x2='740' y2='120' stroke='#5B6862' stroke-width='2'/><line x1='130' y1='300' x2='420' y2='300' stroke='#5B6862' stroke-width='2'/><line x1='540' y1='30' x2='540' y2='120' stroke='#5B6862' stroke-width='2'/><path d='M 130 150 C 60 200, 60 250, 130 280' stroke='#B7791F' stroke-width='2' stroke-dasharray='5 4' fill='none'/><text x='52' y='215' font-size='11' fill='#B7791F' text-anchor='middle' font-weight='400'>same label, separate</text><text x='52' y='229' font-size='11' fill='#B7791F' text-anchor='middle' font-weight='400'>entities</text><rect x='35' y='98' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#0E6E63' stroke-width='2'/><text x='130' y='117' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Dread Pirate Roberts</text><text x='130' y='133' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>person (site persona)</text><rect x='35' y='278' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#0E6E63' stroke-width='2'/><text x='130' y='297' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Dread Pirate Roberts</text><text x='130' y='313' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>person · alias &#x27;Ross Ulbricht&#x27; (fragment C)</text><rect x='325' y='278' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#2F5D8A' stroke-width='2'/><text x='420' y='297' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>PGP key token</text><text x='420' y='313' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>bank_account kind (G1)</text><rect x='235' y='98' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#2F5D8A' stroke-width='2'/><text x='330' y='117' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Silk Road DPR account</text><text x='330' y='133' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>phone kind (G1)</text><rect x='445' y='98' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#2F5D8A' stroke-width='2'/><text x='540' y='117' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Seized laptop</text><text x='540' y='133' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>imei kind (G1)</text><rect x='645' y='98' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#2F5D8A' stroke-width='2'/><text x='740' y='117' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>OS login &#x27;frosty&#x27;</text><text x='740' y='133' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>phone kind (G1)</text><rect x='645' y='278' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#0E6E63' stroke-width='2'/><text x='740' y='297' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Ross Ulbricht</text><text x='740' y='313' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>fragment B (laptop)</text><rect x='645' y='418' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#0E6E63' stroke-width='2'/><text x='740' y='437' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Ross Ulbricht</text><text x='740' y='453' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>fragment A · aliases altoid, frosty — no edges in v1.0</text><rect x='445' y='8' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#2F5D8A' stroke-width='2'/><text x='540' y='27' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Pidgin account</text><text x='540' y='43' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>phone kind</text><rect x='35' y='418' width='190' height='44' rx='4' fill='#FFFFFF' stroke='#8A958F' stroke-width='2'/><text x='130' y='437' font-size='12' fill='#16201C' text-anchor='middle' font-weight='600'>Investigated person ALT-1</text><text x='130' y='453' font-size='9.5' fill='#5B6862' text-anchor='middle' font-weight='400'>no path to DPR (correct)</text><text x='24' y='505' font-size='12' fill='#16201C' text-anchor='start' font-weight='400'>v1.0 blind run: DPR ↔ Ross Ulbricht (fragment B) by a 4-hop path through the seized laptop; fragment C merged with DPR via the PGP key.</text><text x='24' y='523' font-size='12' fill='#5B6862' text-anchor='start' font-weight='400'>Fragment A (Gmail-linked accounts) had no edges because its identifiers never became canonical entities (gap G2). Tokens not shown.</text></svg>
